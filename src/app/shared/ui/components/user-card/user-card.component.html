<section class="user-card">
  @if(logged) {
  <div class="user-image-container" (click)="toggleVisibleUserInfo()">
    <img
      class="user-image"
      [src]="authService.user?.photoURL"
      alt="user image"
    />
  </div>
  } @else {
  <button (click)="handleAuth()" class="navbar__button-auth">
    Login with Google
  </button>
  } @if(logged && visibleButtonAuth()) {
  <section
    appClickOutSide
    (clickOutSideAction)="closeUserInfo()"
    class="navbar__user-info"
    id="popup-info"
  >
    @if(logged) {
    <p class="user-name">
      {{ authService.user?.displayName }}
    </p>
    }
    <button (click)="handleAuth()" class="navbar__button-auth">Logout</button>
  </section>
  }
</section>
